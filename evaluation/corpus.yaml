# DocuMind evaluation corpus — robot imitation learning & cross-embodiment learning.
#
# Every entry was checked against the arXiv API (exact title + version) and its
# arXiv abstract page (license) on 2026-10-14. PDFs are NEVER committed:
# `evaluation/download_corpus.py` fetches them from arXiv into the gitignored
# `evaluation/data/pdfs/` and records SHA-256 hashes in `corpus.lock.json`.
#
# License note: most entries use arXiv's non-exclusive distribution license
# (arXiv may redistribute; we may not), three are CC BY 4.0. Annotations in
# questions.jsonl therefore carry only short evidence quotes, never full text.
#
# To change the corpus: add/remove entries or flip `enabled`. Paper `id`s are
# the stable keys used by questions.jsonl.

version: 1
domain: robot imitation learning and cross-embodiment learning
source: arxiv

