name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    # Postgres + pgvector — the API test suite creates the schema and runs
    # cosine-distance queries against a real database.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: documind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/documind_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/documind_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Compile worker sources
        run: python -m compileall -q worker

      - name: Run test suite
        working-directory: api
        run: pytest -q
