version: '3.8'

# Local development stack. Stateful services (Postgres, Redis) are NOT run
# locally anymore — point DATABASE_URL and REDIS_URL at the managed free tiers
# (Supabase Postgres + pgvector, Upstash Redis). See .env.example.

services:
  api:
    build: ./api
    container_name: rag_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - shared_data:/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL:-gemini-3.6-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-2}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-*}

  worker:
    build: ./worker
    container_name: rag_worker
    volumes:
      - ./worker:/app
      - shared_data:/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-2}

  ui:
    build: ./ui
    container_name: rag_ui
    ports:
      - "8501:8501"
      - "80:8501"
    volumes:
      - ./ui:/app
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  shared_data:
