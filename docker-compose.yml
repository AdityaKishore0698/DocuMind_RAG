# ResearchLens — local stack: API + Celery worker + Redis.
#
# Runs next to two things on the host (see README "Quick start"):
#   * the local Supabase stack (`supabase start`): Postgres + pgvector :54322, auth/storage API :54321
#   * Ollama (`ollama serve`) :11434 — native, so it can use the Mac/Linux GPU
# Containers reach both through host.docker.internal. Configuration comes from .env.local, which
# scripts/setup_local_env.sh generates from `supabase status` (never commit it).
#
#   docker compose up -d --build      # start
#   docker compose logs -f api worker # follow logs
#   docker compose down               # stop (add -v to also drop the Redis volume)

name: researchlens

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build: ./api
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop/OrbStack provide it already
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  worker:
    build: ./worker
    command: ["celery", "-A", "celery_app", "worker", "--pool=solo", "--loglevel=info"]
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy   # the API creates the schema on first start
    restart: unless-stopped

volumes:
  redis_data:
